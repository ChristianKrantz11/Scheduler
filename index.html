<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple hour-by-hour planner for your workday." />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.8.1/css/all.css"
      integrity="sha384-50oBUHEmvpQ+1lW4y57PTFmhCaXp0ML5d60M1M7uH2+nqUivzIebhndOJK28anvf"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Work Day Scheduler</title>
  </head>

  <body>
    <header class="text-center py-4 mb-3">
      <h1>Work Day Scheduler</h1>
      <p class="lead mb-1">A simple calendar for scheduling your workday</p>
      <p id="current-day" class="mb-0"></p>
    </header>

    <main class="container">
      <div id="time-blocks"></div>

      <div class="text-right my-4">
        <button id="clear-schedule" type="button" class="btn btn-outline-secondary">
          <i class="fas fa-trash-alt" aria-hidden="true"></i> Clear schedule
        </button>
      </div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
